<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300">
  <title>Neyman orthogonality</title>
  <desc>Schematic of the mean score with the target held at its true value. Along a nuisance perturbation, both scores are zero at the true nuisance model. The orthogonal score has a horizontal tangent there, while the non-orthogonal score has a nonzero slope.</desc>
  <rect width="480" height="300" fill="#eef3ef"/>
  <g font-family="system-ui,sans-serif" fill="#202724" text-anchor="middle">
    <text x="240" y="43" font-size="23" font-weight="650">Neyman orthogonality</text>

    <g fill="none" stroke="#85928c" stroke-width="1.3">
      <path d="M64 75V226M64 162H432"/>
      <path d="M238 162V210" stroke-dasharray="3 4"/>
    </g>
    <text x="51" y="167" font-size="14">0</text>
    <text x="26" y="151" font-size="14" transform="rotate(-90 26 151)">Mean score at true target</text>
    <text x="238" y="229" font-size="15" font-weight="600">True nuisance model</text>
    <text x="238" y="253" font-size="15" fill="#4c5b55">Perturbation to the nuisance model</text>

    <g fill="none" stroke-width="3" stroke-linecap="round">
      <path d="M100 224 376 100M247 277H276" stroke="#865120" stroke-dasharray="6 5"/>
      <path d="M100 113Q238 211 376 113M76 277H105" stroke="#205b51"/>
    </g>
    <circle cx="238" cy="162" r="4" fill="#202724"/>
    <g font-size="15" font-weight="600" text-anchor="start">
      <text x="115" y="282">Orthogonal</text>
      <text x="286" y="282">Non-orthogonal</text>
    </g>
  </g>
</svg>
